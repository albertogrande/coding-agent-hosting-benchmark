# {{app}} — Railway service
# The hourly schedule is set on the service in Railway (cron). This file
# is the job itself: one run, then exit.
[build]
builder = "NIXPACKS"

[deploy]
preDeployCommand = "npm run migrate"
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 2
